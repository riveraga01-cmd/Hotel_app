name: Build & Release Android APK

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publicar release formal con el APK adjunto'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Nombre de la versión (ej. v1.0.0)'
        required: false
        type: string
        default: 'v1.0.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Java JDK 21 con Caching de Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Instalar SDK de Android, Herramientas y Licencias
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;35.0.0" "platforms;android-35" || true

      - name: Preparar variables de entorno y archivos base (.env)
        run: |
          touch .env
          touch .env.example

      - name: Preparar Keystore de depuración (debugConfig)
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -s debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Verificar permisos de gradlew
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Error: gradlew no existe en la raíz."
            exit 1
          fi
          sed -i 's/\r$//' ./gradlew || true
          chmod +x ./gradlew

      - name: Crear google-services.json
        env:
          GOOGLE_SERVICES_JSON_RAW: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          cat << 'EOF' > app/google-services.json
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF

          # Si por formato de GitHub Actions quedó vacío pero la variable env existe, usarla
          if [ ! -s app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON_RAW" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON_RAW" > app/google-services.json
          fi

          # Si el contenido vino codificado en Base64, decodificarlo a JSON plano
          if [ -s app/google-services.json ] && ! grep -q "^{" app/google-services.json 2>/dev/null; then
            base64 -d app/google-services.json > app/google-services.tmp.json 2>/dev/null || base64 --decode app/google-services.json > app/google-services.tmp.json 2>/dev/null || true
            if grep -q "^{" app/google-services.tmp.json 2>/dev/null; then
              mv app/google-services.tmp.json app/google-services.json
            fi
            rm -f app/google-services.tmp.json
          fi

          # Validar que el archivo no esté vacío y contenga 'project_info'. Si falta o está corrupto, usar la configuración base
          if [ ! -s app/google-services.json ] || ! grep -q "project_info" app/google-services.json 2>/dev/null; then
            echo "Aviso: Secret no configurado o malformado. Inyectando configuración base de Hotel Rivera..."
            cat << 'EOF_BACKUP' > app/google-services.json
{
  "project_info": {
    "project_number": "727663905250",
    "project_id": "gen-lang-client-0843890405",
    "storage_bucket": "gen-lang-client-0843890405.firebasestorage.app"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:727663905250:android:3767a84f35aa57c150d1bb",
        "android_client_info": {
          "package_name": "com.aistudio.hotelrivera.rvkpxz"
        }
      },
      "oauth_client": [
        {
          "client_id": "727663905250-dekkvnar7i3kmc08tqbb3bdk59gda0ht.apps.googleusercontent.com",
          "client_type": 1,
          "android_info": {
            "package_name": "com.aistudio.hotelrivera.rvkpxz",
            "certificate_hash": "232b14e6a4373e79b58c8910136e64895714f45f"
          }
        },
        {
          "client_id": "727663905250-4s2ft1but35ep4bm9ndslhiq5bk9sdlc.apps.googleusercontent.com",
          "client_type": 3
        }
      ],
      "api_key": [
        {
          "current_key": "AIzaSyAZ67P-ShaJ8mAR2FRpTDLQfXgH3dgvJrk"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": [
            {
              "client_id": "727663905250-4s2ft1but35ep4bm9ndslhiq5bk9sdlc.apps.googleusercontent.com",
              "client_type": 3
            }
          ]
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF_BACKUP
          fi

          echo "Validación de app/google-services.json:"
          ls -lh app/google-services.json
          head -n 5 app/google-services.json

      - name: Compilar APK con Gradle
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Generar y verificar APK en el módulo app
        run: |
          mkdir -p build/dist-apk
          APK_ORIGEN="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_ORIGEN" ]; then
            APK_ORIGEN=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_ORIGEN" ] || [ ! -f "$APK_ORIGEN" ] || [ ! -s "$APK_ORIGEN" ]; then
            echo "Error crítico: No se generó ningún APK válido."
            exit 1
          fi
          cp "$APK_ORIGEN" build/dist-apk/HotelRivera-v1.0.apk
          ls -lh build/dist-apk/HotelRivera-v1.0.apk

      - name: Publicar Artefacto descargable en GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: HotelRivera-Android-APK
          path: build/dist-apk/HotelRivera-v1.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar APK en GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event.inputs.create_release == 'true' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ github.event.inputs.tag_name || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v1.0.0' }}
          name: "Hotel Rivera ${{ github.event.inputs.tag_name || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v1.0.0' }}"
          body: |
            ### 📱 Hotel Rivera — Instalador de Aplicación Android (APK)

            Versión oficial compilada y lista para su descarga directa.

            #### 📥 Descarga Directa:
            - Pulsa sobre **`HotelRivera-v1.0.apk`** en la sección **Assets** de esta Release.
          files: build/dist-apk/HotelRivera-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
